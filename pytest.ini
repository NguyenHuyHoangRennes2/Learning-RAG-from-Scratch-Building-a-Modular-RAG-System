# Configuration de pytest (lue automatiquement à la racine du projet).
[pytest]
# Dossier où chercher les tests
testpaths = tests

# Marqueurs personnalisés : les déclarer évite un avertissement "unknown marker"
markers =
    slow: test lent qui charge le VRAI modèle d'embeddings (téléchargement au 1er lancement). Lancer avec : python -m pytest -m slow

# Par défaut, les tests lents sont exclus : la suite reste rapide (< 2 s)
addopts = -m "not slow"
